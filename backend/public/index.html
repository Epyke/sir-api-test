<!doctype html>
<html>
  <head>
    <title>API TEST SIR</title>
  </head>
  <body>
    <div id="students">
      <h1>Alunos:</h1>
      <button id="newStudentButton">Novo Aluno</button>
      <div id="studentsList"></div>
    </div>

    <div id="courses">
      <h1>Cursos:</h1>
      <button id="newCourseButton">Novo Curso</button>
      <div id="coursesList"></div>
    </div>

    <dialog id="newStudentDialog">
      <form id="newStudentForm">
        <div>
          <button type="button" id="exitStudentDialogButton">X</button>
          <h2 id="studentModalTitle">Criação Aluno</h2>
        </div>
        <input type="hidden" id="studentId" name="id" />
        <div>
          <label for="name">Nome:</label>
          <input
            id="studentName"
            name="name"
            type="text"
            required="true"
            placeholder="António"
          />
        </div>
        <div>
          <label for="lastName">Apelido:</label>
          <input
            id="studentLastname"
            name="lastName"
            type="text"
            required="true"
            placeholder="Ribeiro"
          />
        </div>
        <div>
          <label for="age">Idade:</label>
          <input
            id="studentAge"
            name="age"
            type="number"
            min="1"
            max="122"
            required="true"
            placeholder="22"
          />
        </div>
        <div>
          <label for="courseId">Curso:</label>
          <select name="courseId" id="cursosSelect"></select>
        </div>
        <div>
          <label for="year">Ano Curricular:</label>
          <select required="true" id="studentYear" name="year">
            <option value="1">1ºano</option>
            <option value="2">2ºano</option>
            <option value="3">3ºano</option>
          </select>
        </div>
        <button type="submit" id="studentSubmitButton">Criar</button>
      </form>
    </dialog>

    <dialog id="newCourseDialog">
      <form id="newCourseForm">
        <div>
          <button type="button" id="exitCourseDialogButton">X</button>
          <h2 id="courseModalTitle">Criação Curso</h2>
        </div>
        <input type="hidden" id="courseId" name="id" />
        <div>
          <label for="courseName">Nome Curso:</label>
          <input
            id="courseName"
            name="courseName"
            type="text"
            required="true"
            placeholder="Nome Curso"
          />
        </div>
        <button type="submit" id="courseSubmitButton">Criar</button>
      </form>
    </dialog>
    <script src="./script.js" defer></script>
  </body>
</html>
